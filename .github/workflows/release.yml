name: Release APK

on:
  push:
    tags:
      - 'v*'   # يعمل عند دفع tag مثل v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Rename APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/*.apk release-apk/ScreenLens-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/ScreenLens-${{ github.ref_name }}.apk
          generate_release_notes: true
